<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка Сундуков</title>
<style>
  :root {
    --gold: #f5c451;
    --gold-2: #ffde8a;
    --gold-dark: #b8860b;
    --pink: #ff4d8d;
    --violet: #7a3cff;
    --bg-1: #0a0616;
    --bg-2: #150a2e;
    --bg-3: #1f0f3d;
    --panel: rgba(255,255,255,0.04);
    --panel-border: rgba(255,255,255,0.09);
    --text-dim: #9a92b8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: url('fon.jpg') center / cover no-repeat fixed;
    background-color: var(--bg-1);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 14px 24px;
    user-select: none;
    overflow-x: hidden;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,6,22,0.55), rgba(10,6,22,0.35) 45%, rgba(10,6,22,0.7));
    z-index: -1;
    pointer-events: none;
  }

  .coin-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .coin-bg-item {
    position: absolute;
    display: block;
    line-height: 1;
    filter: drop-shadow(0 0 12px rgba(245,196,81,0.6));
    opacity: 0.35;
    user-select: none;
  }

  .coin-bg-item.c1 { font-size: 42px; top: 12%; left: -10%; animation: float1 26s linear infinite; }
  .coin-bg-item.c2 { font-size: 28px; top: 32%; left: -10%; opacity: 0.25; animation: float2 34s linear infinite; animation-delay: -8s; }
  .coin-bg-item.c3 { font-size: 56px; top: 58%; left: -15%; opacity: 0.3; animation: float3 40s linear infinite; animation-delay: -14s; }
  .coin-bg-item.c4 { font-size: 22px; top: 78%; left: -10%; opacity: 0.4; animation: float1 30s linear infinite; animation-delay: -20s; }
  .coin-bg-item.c5 { font-size: 36px; top: 88%; left: 110%; opacity: 0.28; animation: float4 32s linear infinite; animation-delay: -6s; }
  .coin-bg-item.c6 { font-size: 48px; top: 22%; left: 110%; opacity: 0.32; animation: float5 38s linear infinite; animation-delay: -12s; }
  .coin-bg-item.c7 { font-size: 26px; top: 48%; left: 110%; opacity: 0.3; animation: float4 28s linear infinite; animation-delay: -22s; }
  .coin-bg-item.c8 { font-size: 64px; top: 68%; left: 110%; opacity: 0.22; animation: float5 44s linear infinite; animation-delay: -30s; }

  @keyframes float1 { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(30vw, -20px) rotate(90deg); } 50% { transform: translate(60vw, 20px) rotate(180deg); } 75% { transform: translate(90vw, -15px) rotate(270deg); } 100% { transform: translate(130vw, 0) rotate(360deg); } }
  @keyframes float2 { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(35vw, 30px) rotate(-90deg); } 50% { transform: translate(70vw, -25px) rotate(-180deg); } 75% { transform: translate(100vw, 20px) rotate(-270deg); } 100% { transform: translate(140vw, 0) rotate(-360deg); } }
  @keyframes float3 { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(75vw, -40px) rotate(180deg); } 100% { transform: translate(150vw, 0) rotate(360deg); } }
  @keyframes float4 { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(-35vw, 25px) rotate(-90deg); } 50% { transform: translate(-70vw, -30px) rotate(-180deg); } 75% { transform: translate(-105vw, 20px) rotate(-270deg); } 100% { transform: translate(-150vw, 0) rotate(-360deg); } }
  @keyframes float5 { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(-30vw, -25px) rotate(90deg); } 50% { transform: translate(-65vw, 20px) rotate(180deg); } 75% { transform: translate(-100vw, -15px) rotate(270deg); } 100% { transform: translate(-140vw, 0) rotate(360deg); } }

  .top-bar {
    width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative;
  }
  .back-arrow { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--gold-2); opacity: 0.85; pointer-events: none; flex-shrink: 0; }
  .back-arrow svg { width: 24px; height: 24px; display: block; }
  .back-arrow-spacer { width: 40px; height: 40px; flex-shrink: 0; pointer-events: none; }

  .balance-card {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(245,196,81,0.14), rgba(245,196,81,0.04));
    border: 1px solid rgba(245,196,81,0.35); box-shadow: 0 6px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(6px); flex: 0 0 auto; cursor: pointer; transition: transform .15s, box-shadow .2s;
  }
  .balance-card:active { transform: scale(0.95); }
  .balance-card .coin { font-size: 1.3rem; filter: drop-shadow(0 0 8px rgba(245,196,81,0.8)); flex-shrink: 0; }
  .balance-card .val { font-size: 1.2rem; font-weight: 800; color: var(--gold-2); text-shadow: 0 0 12px rgba(245,196,81,0.5); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .reel-wrap {
    position: relative; width: 100%; max-width: 380px; height: 120px; margin-top: 8px; border-radius: 16px;
    background: linear-gradient(180deg, #1a1020, #0f0818); border: 2px solid rgba(245,196,81,0.4);
    box-shadow: 0 0 24px rgba(245,196,81,0.25), inset 0 0 20px rgba(0,0,0,0.6); overflow: hidden; flex-shrink: 0;
  }
  .reel-wrap::before, .reel-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 50px; z-index: 3; pointer-events: none; }
  .reel-wrap::before { left: 0; background: linear-gradient(90deg, #0f0818, transparent); }
  .reel-wrap::after  { right: 0; background: linear-gradient(270deg, #0f0818, transparent); }

  .reel-pointer {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 4px;
    background: linear-gradient(180deg, var(--pink), var(--gold-2), var(--pink));
    box-shadow: 0 0 16px rgba(255,77,141,0.9), 0 0 32px rgba(245,196,81,0.5); z-index: 4; pointer-events: none; border-radius: 2px;
  }
  .reel-pointer::before, .reel-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; }
  .reel-pointer::before { top: 0; border-top: 10px solid var(--pink); }
  .reel-pointer::after  { bottom: 0; border-bottom: 10px solid var(--pink); }

  .reel-strip { position: absolute; top: 0; left: 0; height: 100%; display: flex; will-change: transform; transition: transform 5s cubic-bezier(0.08, 0.82, 0.17, 1); }
  .reel-item { height: 100%; width: 120px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  .reel-item img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 0 8px rgba(245,196,81,0.25)); }

  .reel-count {
    margin-top: 14px; font-size: 2.4rem; font-weight: 900; color: var(--gold-2);
    text-shadow: 0 0 16px rgba(245,196,81,0.7), 0 0 32px rgba(245,196,81,0.4);
    font-variant-numeric: tabular-nums; letter-spacing: 2px; height: 3rem;
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .reel-count.spinning { animation: countPulse .15s ease-in-out infinite alternate; }
  @keyframes countPulse { from { transform: scale(1); opacity: .7; } to { transform: scale(1.12); opacity: 1; } }
  .reel-count .label { font-size: .75rem; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-right: 8px; text-shadow: none; }

  .controls { margin-top: 12px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .bet-row {
    display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 8px 10px; backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .bet-row .bet-coin { font-size: 1.4rem; filter: drop-shadow(0 0 8px rgba(245,196,81,0.8)); padding-left: 4px; flex-shrink: 0; line-height: 1; }
  .bet-row input {
    flex: 1; background: transparent; border: none; color: var(--gold-2); font-size: 1.3rem; font-weight: 800;
    outline: none; text-align: center; min-width: 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(245,196,81,0.4);
  }
  .bet-row input::-webkit-outer-spin-button, .bet-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .bet-row input[type=number] { -moz-appearance: textfield; }

  .bet-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(245,196,81,0.35);
    background: linear-gradient(180deg, rgba(245,196,81,0.18), rgba(245,196,81,0.06));
    color: var(--gold-2); font-size: 1.3rem; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .1s, background .2s; flex-shrink: 0;
  }
  .bet-btn:active { transform: scale(0.92); background: rgba(245,196,81,0.3); }

  #spinBtn {
    position: relative; width: 100%; padding: 17px; border: none; border-radius: 16px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold) 45%, var(--gold-dark));
    color: #2a1a00; font-size: 1.15rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; overflow: hidden;
    box-shadow: 0 8px 24px rgba(245,196,81,0.35), 0 2px 0 rgba(255,255,255,0.5) inset, 0 -3px 0 rgba(0,0,0,0.2) inset;
    transition: transform .1s, box-shadow .2s, opacity .2s;
  }
  #spinBtn::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg); animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60%, 100% { left: -60%; } 80% { left: 130%; } }
  #spinBtn:active { transform: scale(0.97); }
  #spinBtn:disabled { opacity: 0.45; box-shadow: none; cursor: default; }
  #spinBtn:disabled::after { animation: none; }

  /* ================= ОВЕРЛЕЙ СУНДУКОВ ================= */
  .chests-overlay {
    position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 6, 22, 0.6); /* Статичный фон без тяжелого transition */
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease; /* Плавно только прозрачность */
  }
  .chests-overlay.show { opacity: 1; pointer-events: auto; }

  /* Поднимаем контейнер еще выше */
  .chests-area {
    width: 100%; max-width: 360px; display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; padding: 20px; align-content: center;
    transform: translateY(-28vh); /* Поднято еще выше к счетчику */
  }
  
  .chest {
    position: relative; width: 74px; height: 74px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: none; border: none; padding: 0;
    animation: chestIn .45s cubic-bezier(0.34, 1.56, 0.64, 1) both; transition: transform .15s;
  }
  .chest img {
    width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none;
    transition: transform .3s ease, filter .35s, opacity .25s;
  }
  .chest:active { transform: scale(0.9); }
  .chest:active img { filter: brightness(1.15); }
  .chest:not(.opened):hover img { transform: scale(1.06); filter: brightness(1.15); }

  .chest.wood    img { filter: drop-shadow(0 0 6px rgba(217,154,90,0.55)); }
  .chest.stone   img { filter: drop-shadow(0 0 6px rgba(184,194,204,0.55)); }
  .chest.iron    img { filter: drop-shadow(0 0 8px rgba(192,208,220,0.65)); }
  .chest.gold    img { filter: drop-shadow(0 0 10px rgba(245,196,81,0.75)) drop-shadow(0 0 20px rgba(245,196,81,0.35)); }
  .chest.diamond img { filter: drop-shadow(0 0 10px rgba(110,231,255,0.8)) drop-shadow(0 0 22px rgba(110,231,255,0.45)); }

  .chest.gold img    { animation: goldPulse 2s ease-in-out infinite; }
  .chest.diamond img { animation: diamondPulse 2s ease-in-out infinite; }

  @keyframes goldPulse {
    0%,100% { filter: drop-shadow(0 0 8px rgba(245,196,81,0.65)) drop-shadow(0 0 16px rgba(245,196,81,0.3)); }
    50%     { filter: drop-shadow(0 0 14px rgba(245,196,81,0.95)) drop-shadow(0 0 28px rgba(245,196,81,0.5)); }
  }
  @keyframes diamondPulse {
    0%,100% { filter: drop-shadow(0 0 10px rgba(110,231,255,0.75)) drop-shadow(0 0 20px rgba(110,231,255,0.4)); }
    50%     { filter: drop-shadow(0 0 16px rgba(110,231,255,1)) drop-shadow(0 0 34px rgba(110,231,255,0.6)); }
  }

  .chest.opening img { animation: chestShake .6s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes chestShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    10% { transform: translateX(-3px) rotate(-3deg); }
    20% { transform: translateX(3px) rotate(3deg); }
    30% { transform: translateX(-4px) rotate(-4deg); }
    40% { transform: translateX(4px) rotate(4deg); }
    50% { transform: translateX(-3px) rotate(-3deg); }
    60% { transform: translateX(3px) rotate(3deg); }
    70% { transform: translateX(-2px) rotate(-2deg); }
    80% { transform: translateX(2px) rotate(2deg); }
    90% { transform: translateX(-1px) rotate(-1deg); }
  }

  .chest.opened { cursor: default; animation: chestPop .5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .chest.opened img { transform: scale(1.08); }
  .chest.opened.wood img    { filter: drop-shadow(0 0 10px rgba(217,154,90,0.9)); }
  .chest.opened.stone img   { filter: drop-shadow(0 0 10px rgba(184,194,204,0.9)); }
  .chest.opened.iron img    { filter: drop-shadow(0 0 14px rgba(192,208,220,1)); }
  .chest.opened.gold img    { filter: drop-shadow(0 0 16px rgba(245,196,81,1)) drop-shadow(0 0 34px rgba(245,196,81,0.65)); }
  .chest.opened.diamond img { filter: drop-shadow(0 0 18px rgba(110,231,255,1)) drop-shadow(0 0 40px rgba(110,231,255,0.7)); }

  .chest.crit-mega::after, .chest.crit-jackpot::after {
    content: ''; position: absolute; inset: -10px; border-radius: 50%; pointer-events: none; animation: critFlash 1.2s ease-out;
  }
  .chest.crit-mega::after { background: radial-gradient(circle, rgba(255,200,80,0.7), transparent 65%); }
  .chest.crit-jackpot::after { background: radial-gradient(circle, rgba(255,80,200,0.8), transparent 65%); animation: critFlash 1.6s ease-out; }
  @keyframes critFlash {
    0%   { opacity: 0; transform: scale(0.5); }
    40%  { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1.8); }
  }

  .chest .mult {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); font-size: .62rem; font-weight: 900;
    background: linear-gradient(180deg, #2a1a00, #1a0f00); color: var(--gold-2); padding: 3px 8px;
    border-radius: 8px; border: 1px solid var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 8px rgba(245,196,81,0.4);
    z-index: 2; white-space: nowrap; animation: multIn .3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .chest .mult::before { content: '🪙'; margin-right: 3px; font-size: .72rem; }
  .chest .mult.crit { border-color: #ff9c2a; box-shadow: 0 0 12px rgba(255,156,42,0.8); color: #ffb84d; }
  .chest .mult.jackpot { border-color: #ff4de0; box-shadow: 0 0 16px rgba(255,77,224,0.9); color: #ff7dea; background: linear-gradient(180deg, #3a0030, #1a0018); }
  @keyframes multIn {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.3); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  @keyframes chestIn {
    0%   { opacity: 0; transform: translateY(24px) scale(0.4) rotate(-8deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }
  @keyframes chestPop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-2deg); }
    75% { transform: translateX(4px) rotate(2deg); }
  }
  .chest.hint { animation: shake 0.5s ease 2; }

  /* ================= ЛЕНТА ПОБЕД ================= */
  .live-feed {
    margin-top: 26px; width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 14px; padding: 10px 12px;
    backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); overflow: hidden;
  }
  .live-feed .feed-title { display: flex; align-items: center; gap: 6px; font-size: .65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 8px; padding-left: 2px; }
  .live-feed .feed-title .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.9); animation: livePulse 1.4s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(0.8); } }
  .feed-list { display: flex; flex-direction: column; gap: 6px; max-height: 138px; overflow: hidden; position: relative; }
  .feed-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .78rem; line-height: 1.2;
    padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: feedIn .4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .feed-item.mine { background: linear-gradient(90deg, rgba(245,196,81,0.12), rgba(245,196,81,0.03)); border-color: rgba(245,196,81,0.4); box-shadow: 0 0 12px rgba(245,196,81,0.15); }
  .feed-item .id { color: #cfc8e0; font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
  .feed-item.mine .id { color: var(--gold-2); font-weight: 800; }
  .feed-item .sum { margin-left: auto; font-weight: 900; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .feed-item .sum.win { color: #ffde8a; text-shadow: 0 0 8px rgba(245,196,81,0.5); }
  .feed-item .sum.lose { color: #ff6b8a; }
  .feed-item .sum .coin-ico { font-size: .8rem; }
  @keyframes feedIn { 0% { opacity: 0; transform: translateX(-12px); } 100% { opacity: 1; transform: translateX(0); } }

  /* ================= ПОБЕДА/ПРОИГРЫШ ================= */
  .win-overlay {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; /* Поднимаем наверх */
    padding-top: 22vh; /* Отступ сверху такой же, как у сундуков */
    background: rgba(10, 6, 22, 0.92); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .35s ease; cursor: pointer;
  }
  .win-overlay.show { opacity: 1; pointer-events: auto; }
  .win-overlay::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(245,196,81,0.35), transparent 55%);
    animation: winGlow 2s ease-in-out infinite;
  }
  @keyframes winGlow { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }

  .win-overlay .big-coin {
    font-size: 6rem; filter: drop-shadow(0 0 30px rgba(245,196,81,0.9)); animation: coinSpin 1.5s ease-in-out infinite; margin-bottom: 8px; z-index: 1;
  }
  @keyframes coinSpin { 0%,100% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.08); } }
  
  .win-overlay .big-amount {
    font-size: 3.2rem; font-weight: 900; color: var(--gold-2);
    text-shadow: 0 0 30px rgba(245,196,81,0.8), 0 0 60px rgba(245,196,81,0.4);
    letter-spacing: 2px; font-variant-numeric: tabular-nums; z-index: 1;
    animation: amountIn .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .win-overlay.jackpot-mode::before { background: radial-gradient(circle at 50% 30%, rgba(255,77,224,0.4), transparent 55%); animation: winGlow 1s ease-in-out infinite; }
  .win-overlay.jackpot-mode .big-coin { filter: drop-shadow(0 0 40px rgba(255,77,224,1)); animation: coinSpin 0.8s ease-in-out infinite; }
  .win-overlay.jackpot-mode .big-amount { color: #ff7dea; text-shadow: 0 0 40px rgba(255,77,224,1), 0 0 80px rgba(255,77,224,0.6); }
  
  .win-overlay.lose-mode::before { background: radial-gradient(circle at 50% 30%, rgba(255,60,100,0.3), transparent 55%); }
  .win-overlay.lose-mode .big-coin { filter: drop-shadow(0 0 30px rgba(255,80,110,0.8)) grayscale(1); animation: none; }
  .win-overlay.lose-mode .big-amount { color: #ff6b8a; text-shadow: 0 0 30px rgba(255,107,138,0.8), 0 0 60px rgba(255,107,138,0.4); }
  
  .win-overlay .tap-hint {
    position: absolute; bottom: 40px; font-size: .75rem; color: var(--text-dim);
    letter-spacing: 1px; animation: tapBlink 1.5s ease-in-out infinite; z-index: 1;
  }
  @keyframes tapBlink { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
  @keyframes amountIn { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: scale(1); } }

  .win-overlay .overlay-chest-wrap {
    width: 180px; height: 180px; display: none; align-items: center; justify-content: center; margin-bottom: 6px; z-index: 1;
  }
  .win-overlay .overlay-chest-wrap img {
    width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 30px rgba(110,231,255,0.9));
    transition: transform .3s ease, filter .35s, opacity .25s;
  }
  .win-overlay .overlay-chest-wrap.shaking img { animation: overlayChestShake .7s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes overlayChestShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    10% { transform: translateX(-5px) rotate(-4deg); }
    20% { transform: translateX(5px) rotate(4deg); }
    30% { transform: translateX(-6px) rotate(-5deg); }
    40% { transform: translateX(6px) rotate(5deg); }
    50% { transform: translateX(-5px) rotate(-4deg); }
    60% { transform: translateX(5px) rotate(4deg); }
    70% { transform: translateX(-3px) rotate(-3deg); }
    80% { transform: translateX(3px) rotate(3deg); }
    90% { transform: translateX(-2px) rotate(-2deg); }
  }
  .win-overlay .overlay-chest-wrap img.opened-img { filter: drop-shadow(0 0 40px rgba(110,231,255,1)) drop-shadow(0 0 80px rgba(110,231,255,0.6)); }

  .win-overlay.chest-anim .big-coin { display: none; }
  .win-overlay.chest-anim .big-amount { opacity: 0; }
  .win-overlay.chest-anim .big-amount.revealed { opacity: 1; animation: amountIn .6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  /* ================= НАСТРОЙКИ ================= */
  .settings-modal {
    position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 6, 22, 0.85); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; padding: 20px;
  }
  .settings-modal.show { opacity: 1; pointer-events: auto; }
  .settings-card {
    width: 100%; max-width: 340px; background: linear-gradient(180deg, #1e1430, #150a24);
    border: 1px solid rgba(245,196,81,0.35); border-radius: 20px; padding: 22px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    transform: scale(0.92); transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 90vh; overflow-y: auto;
  }
  .settings-modal.show .settings-card { transform: scale(1); }
  .settings-card h2 { margin: 0 0 18px; font-size: 1.2rem; font-weight: 900; text-align: center; color: var(--gold-2); letter-spacing: 1px; }
  .settings-card label { display: block; font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
  .settings-card input[type="number"] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(245,196,81,0.3);
    background: rgba(0,0,0,0.3); color: var(--gold-2); font-size: 1.1rem; font-weight: 800; outline: none; text-align: center;
  }
  .settings-card input[type="number"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,196,81,0.15); }
  .settings-card .hint-small { font-size: .68rem; color: var(--text-dim); text-align: center; margin-top: 6px; line-height: 1.5; }
  .settings-card .settings-select {
    width: 100%; padding: 12px 40px 12px 14px; border-radius: 12px; border: 1px solid rgba(245,196,81,0.3);
    background-color: rgba(0,0,0,0.3); color: var(--gold-2); font-size: 1rem; font-weight: 800; outline: none;
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23f5c451' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; cursor: pointer;
  }
  .settings-card .settings-select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,196,81,0.15); }
  .settings-card .settings-select option { background: #1e1430; color: #ffde8a; }
  .settings-actions { display: flex; gap: 10px; margin-top: 20px; }
  .settings-actions button {
    flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: .95rem; font-weight: 800; cursor: pointer; transition: transform .1s, opacity .2s; letter-spacing: .5px;
  }
  .settings-actions button:active { transform: scale(0.96); }
  .btn-apply { background: linear-gradient(180deg, var(--gold-2), var(--gold) 50%, var(--gold-dark)); color: #2a1a00; }
  .btn-close { background: rgba(255,255,255,0.08); color: #cfc8e0; border: 1px solid rgba(255,255,255,0.12); }
</style>
</head>
<body>

  <span class="coin-bg-item c6">🪙</span>

<!-- Оверлей для сундуков -->

  </div>
  <div class="big-coin" id="overlayCoin">🪙</div>
  <div class="big-amount" id="winAmount">0</div>
  <div class="tap-hint" id="tapHint">Тапни, чтобы продолжить</div>
</div>

<div class="settings-modal" id="settingsModal">
  <div class="settings-card">
    <h2 id="settingsTitle">⚙️ Настройки</h2>

    <label for="balanceInput" id="labelBalance">Баланс</label>
    <input type="number" id="balanceInput" min="0" step="100" value="1000">

    <label for="winChanceInput" id="labelWinChance">Вероятность сундуков, %</label>
    <input type="number" id="winChanceInput" min="0" max="100" step="1" value="70">
    <div class="hint-small" id="hintWinChance">Шанс, что вообще выпадут сундуки. Но даже с ними сумма может не окупить ставку.</div>

    <label for="chestRangeInput" id="labelChestRange">Сундуков за раунд</label>
    <select id="chestRangeInput" class="settings-select">
      <option value="default" id="optDefault">По умолчанию (1–10, редко большие)</option>
      <option value="2-5">2 – 5</option>
      <option value="5-7">5 – 7</option>
      <option value="7-10">7 – 10</option>
    </select>

    <label for="langInput" id="labelLang">Язык / Language</label>
    <select id="langInput" class="settings-select">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>

    <div class="settings-actions">
      <button class="btn-close" id="settingsClose">Закрыть</button>
      <button class="btn-apply" id="settingsApply">Применить</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ==================== ЯЗЫК ==================== */
  const I18N = {
    ru: {
      spin: 'КРУТИТЬ',
      chestsLabel: 'Сундуков:',
      feedTitle: 'Последние победы',
      tapHint: 'Тапни, чтобы продолжить',
      settingsTitle: '⚙️ Настройки',
      labelBalance: 'Баланс',
      labelWinChance: 'Вероятность сундуков, %',
      hintWinChance: 'Шанс, что вообще выпадут сундуки. Но даже с ними сумма может не окупить ставку.',
      labelChestRange: 'Сундуков за раунд',
      optDefault: 'По умолчанию (1–10, редко большие)',
      labelLang: 'Язык / Language',
      btnClose: 'Закрыть',
      btnApply: 'Применить',
      feedIdPrefix: 'ID ',
    },
    en: {
      spin: 'SPIN',
      chestsLabel: 'Chests:',
      feedTitle: 'Recent wins',
      tapHint: 'Tap to continue',
      settingsTitle: '⚙️ Settings',
      labelBalance: 'Balance',
      labelWinChance: 'Chest chance, %',
      hintWinChance: 'Chance that chests appear at all. Even then the total may not cover your bet.',
      labelChestRange: 'Chests per round',
      optDefault: 'Default (1–10, big ones rare)',
      labelLang: 'Language / Язык',
      btnClose: 'Close',
      btnApply: 'Apply',
      feedIdPrefix: 'ID ',
    }
  };

  let lang = 'ru';
  try {
    const saved = localStorage.getItem('chestLang');
    if (saved === 'ru' || saved === 'en') lang = saved;
  } catch (e) {}

  function t(key) {
    return (I18N[lang] && I18N[lang][key]) || I18N.ru[key] || '';
  }

  function applyLangToUI() {
    document.getElementById('spinBtn').textContent = t('spin');
    document.getElementById('reelCountLabel').textContent = t('chestsLabel');
    document.getElementById('feedTitleText').textContent = t('feedTitle');
    document.getElementById('tapHint').textContent = t('tapHint');
    document.getElementById('settingsTitle').textContent = t('settingsTitle');
    document.getElementById('labelBalance').textContent = t('labelBalance');
    document.getElementById('labelWinChance').textContent = t('labelWinChance');
    document.getElementById('hintWinChance').textContent = t('hintWinChance');
    document.getElementById('labelChestRange').textContent = t('labelChestRange');
    document.getElementById('optDefault').textContent = t('optDefault');
    document.getElementById('labelLang').textContent = t('labelLang');
    document.getElementById('settingsClose').textContent = t('btnClose');
    document.getElementById('settingsApply').textContent = t('btnApply');

    document.querySelectorAll('.feed-item .id').forEach(el => {
      const num = el.textContent.replace(/^ID\s*/, '').trim();
      el.textContent = t('feedIdPrefix') + num;
    });
  }
  /* ================================================= */

  /* ==================== ЗВУКИ ==================== */
  const sfxButton = new Audio('knopka.mp3');
  const sfxSpin   = new Audio('ruletka.mp3');
  const sfxChest  = new Audio('zamok.mp3');
  const sfxWin    = new Audio('good999.mp3');
  const sfxLose   = new Audio('konec.mp3');
  const sfxPobeda = new Audio('pobeda.mp3');

  const bgMusic   = new Audio('pirat.mp3');
  bgMusic.loop = true;
  bgMusic.volume = 0.12;
  bgMusic.preload = 'auto';

  sfxButton.preload = 'auto';
  sfxSpin.preload = 'auto';
  sfxChest.preload = 'auto';
  sfxWin.preload = 'auto';
  sfxLose.preload = 'auto';
  sfxPobeda.preload = 'auto';

  sfxSpin.loop = true;

  sfxButton.volume = 0.7;
  sfxSpin.volume = 0.6;
  sfxChest.volume = 0.35;
  sfxWin.volume = 0.6;
  sfxLose.volume = 0.5;
  sfxPobeda.volume = 0.3;

  const BIG_WIN_THRESHOLD = 10000;

  let audioUnlocked = false;
  let bgMusicStarted = false;

  function startBgMusic() {
    if (bgMusicStarted) return;
    bgMusicStarted = true;
    try {
      const p = bgMusic.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;

    [sfxButton, sfxSpin, sfxChest, sfxWin, sfxLose, sfxPobeda].forEach(a => {
      try {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => {
            a.pause();
            a.currentTime = 0;
            a.muted = false;
          }).catch(() => { a.muted = false; });
        } else {
          a.pause();
          a.currentTime = 0;
          a.muted = false;
        }
      } catch (e) { a.muted = false; }
    });

    startBgMusic();
  }

  function playSfx(audio) {
    try {
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playSpinSound() {
    try {
      sfxSpin.currentTime = 0;
      const p = sfxSpin.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function stopSpinSound() {
    try {
      sfxSpin.pause();
      sfxSpin.currentTime = 0;
    } catch (e) {}
  }
  /* ================================================= */

  const CHEST_TYPES = [
    { key: 'wood',    img: 'derevo.png',  imgOpen: 'derevo_ot.png',  mult: 0.2, weight: 50, label: 'Дерево' },
    { key: 'stone',   img: 'kamen.png',   imgOpen: 'kamen_ot.png',   mult: 0.5, weight: 27, label: 'Камень' },
    { key: 'iron',    img: 'zhelezo.png', imgOpen: 'zhelezo_ot.png', mult: 1.2, weight: 14, label: 'Железо' },
    { key: 'gold',    img: 'zoloto.png',  imgOpen: 'zoloto_ot.png',  mult: 2.5, weight: 7,  label: 'Золото' },
    { key: 'diamond', img: 'almaz.png',   imgOpen: 'almaz_ot.png',   mult: 6.0, weight: 2,  label: 'Алмаз' },
  ];

  const CRITS = [
    { chance: 85,   mult: 1,  cls: '',            name: 'обычный' },
    { chance: 12,   mult: 3,  cls: 'crit',        name: 'крит' },
    { chance: 2.8,  mult: 10, cls: 'crit-mega',   name: 'мега-крит' },
    { chance: 0.2,  mult: 50, cls: 'crit-jackpot',name: 'джекпот' },
  ];

  const LUCKY_MIN = 20000;
  const LUCKY_MAX = 97000;
  const LUCKY_SPIN_MIN = 7;
  const LUCKY_SPIN_MAX = 10;

  const JACKPOT_VISUAL_THRESHOLD = 10000;

  const REEL_ITEM_W = 120;
  const REEL_ITEMS = 30;
  const SPIN_DURATION = 5000;
  const OPEN_ANIM_MS = 650;
  
  // Задержки
  const SHOW_RESULT_DELAY = 1500; // Пауза для просмотра счётчика
  const AFTER_OPEN_DELAY = 1500;  // Пауза после открытия последнего сундука

  const FEED_MAX_ITEMS = 4;
  const FEED_INTERVAL_MIN = 2000;
  const FEED_INTERVAL_MAX = 4000;

  const MY_ID = '231403101';

  let balance = 1000;
  let winChance = 70;
  let chestRange = 'default';
  let spinning = false;
  let openingPhase = false;
  let currentBet = 0;
  let currentChests = [];
  let openedCount = 0;
  let countTimeout = null;
  let roundHasJackpot = false;
  let roundIsLucky = false;
  let roundLuckyAmount = 0;
  let busyChests = new Set();

  let spinsSinceLucky = 0;
  let nextLuckyAt = randLuckyThreshold();
  let feedTimeout = null;

  const reelStrip = document.getElementById('reelStrip');
  const reelWrap = document.querySelector('.reel-wrap');
  const reelCount = document.getElementById('reelCount');
  const countValue = document.getElementById('countValue');
  const balanceEl = document.getElementById('balance');
  const betInput = document.getElementById('betInput');
  const spinBtn = document.getElementById('spinBtn');
  const chestsArea = document.getElementById('chestsArea');
  const chestsOverlay = document.getElementById('chestsOverlay');
  const betMinus = document.getElementById('betMinus');
  const betPlus = document.getElementById('betPlus');
  const winOverlay = document.getElementById('winOverlay');
  const winAmountEl = document.getElementById('winAmount');
  const overlayCoin = document.getElementById('overlayCoin');
  const overlayChestWrap = document.getElementById('overlayChestWrap');
  const overlayChestImg = document.getElementById('overlayChestImg');
  const feedList = document.getElementById('feedList');

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const settingsClose = document.getElementById('settingsClose');
  const settingsApply = document.getElementById('settingsApply');
  const balanceInput = document.getElementById('balanceInput');
  const winChanceInput = document.getElementById('winChanceInput');
  const chestRangeInput = document.getElementById('chestRangeInput');
  const langInput = document.getElementById('langInput');

  function randLuckyThreshold() {
    return LUCKY_SPIN_MIN + Math.floor(Math.random() * (LUCKY_SPIN_MAX - LUCKY_SPIN_MIN + 1));
  }

  function formatMoney(n) {
    return n.toLocaleString('ru-RU');
  }

  function updateBalance() {
    balanceEl.textContent = formatMoney(balance);
  }

  function getBet() {
    let v = parseInt(betInput.value, 10);
    if (isNaN(v) || v < 10) v = 10;
    if (v > balance) v = balance;
    betInput.value = v;
    return v;
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pickChestType() {
    const total = CHEST_TYPES.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * total;
    for (const c of CHEST_TYPES) {
      r -= c.weight;
      if (r <= 0) return c;
    }
    return CHEST_TYPES[0];
  }

  function rollCrit() {
    const total = CRITS.reduce((s, c) => s + c.chance, 0);
    let r = Math.random() * total;
    for (const c of CRITS) {
      r -= c.chance;
      if (r <= 0) return c;
    }
    return CRITS[0];
  }

  function setSpinButtonState() {
    spinBtn.disabled = spinning || openingPhase;
  }

  function buildReel() {
    reelStrip.innerHTML = '';
    for (let i = 0; i < REEL_ITEMS; i++) {
      const type = CHEST_TYPES[Math.floor(Math.random() * CHEST_TYPES.length)];
      const item = document.createElement('div');
      item.className = 'reel-item';
      const img = document.createElement('img');
      img.src = type.img;
      img.alt = type.label;
      item.appendChild(img);
      reelStrip.appendChild(item);
    }
    reelStrip.style.transition = 'none';
    reelStrip.style.transform = 'translateX(0px)';
  }

  function startCountTicker() {
    reelCount.classList.add('spinning');
    let elapsed = 0;
    function tick() {
      countValue.textContent = randomInt(1, 10);
      elapsed += 80;
      const progress = Math.min(elapsed / SPIN_DURATION, 1);
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const nextDelay = 80 + easeOut * 320;
      if (progress < 1) {
        countTimeout = setTimeout(tick, nextDelay);
      }
    }
    tick();
  }

  function stopCountTicker(finalValue) {
    clearTimeout(countTimeout);
    countTimeout = null;
    reelCount.classList.remove('spinning');
    countValue.textContent = finalValue;
    reelCount.style.transform = 'scale(1.25)';
    setTimeout(() => { reelCount.style.transform = 'scale(1)'; }, 180);
  }

  function doSpin() {
    if (spinning || openingPhase) return;
    const bet = getBet();
    if (bet > balance) return;

    unlockAudio();
    playSfx(sfxButton);

    chestsArea.innerHTML = '';
    chestsOverlay.classList.remove('show');
    currentChests = [];
    openedCount = 0;
    roundHasJackpot = false;
    roundIsLucky = false;
    roundLuckyAmount = 0;
    busyChests.clear();

    buildReel();

    spinning = true;
    setSpinButtonState();
    currentBet = bet;
    balance -= bet;
    updateBalance();

    playSpinSound();

    spinsSinceLucky++;
    if (spinsSinceLucky >= nextLuckyAt) {
      roundIsLucky = true;
      roundLuckyAmount = randomInt(LUCKY_MIN, LUCKY_MAX);
      spinsSinceLucky = 0;
      nextLuckyAt = randLuckyThreshold();
    }

    const hasChests = roundIsLucky ? true : Math.random() * 100 < winChance;

    let chestCount = 0;
    if (hasChests) {
      if (roundIsLucky) {
        chestCount = randomInt(3, 5);
        const shares = [];
        let left = roundLuckyAmount;
        for (let i = 0; i < chestCount - 1; i++) {
          const maxShare = Math.floor(left / (chestCount - i) * 1.6);
          const minShare = Math.floor(left / (chestCount - i) * 0.4);
          const s = randomInt(minShare, maxShare);
          shares.push(s);
          left -= s;
        }
        shares.push(left);
        for (let i = shares.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shares[i], shares[j]] = [shares[j], shares[i]];
        }
        for (let i = 0; i < chestCount; i++) {
          const type = pickChestType();
          currentChests.push({
            type,
            crit: { mult: 1, cls: 'crit-jackpot', name: 'lucky' },
            finalMult: 0,
            luckyAmount: shares[i],
            isLucky: true,
            opened: false
          });
        }
        roundHasJackpot = true;
      } else {
        if (chestRange === 'default') {
          const r = Math.random();
          if (r < 0.40)      chestCount = 1;
          else if (r < 0.65) chestCount = 2;
          else if (r < 0.82) chestCount = 3;
          else if (r < 0.91) chestCount = 4;
          else if (r < 0.96) chestCount = 5;
          else if (r < 0.98) chestCount = 6;
          else if (r < 0.99) chestCount = 7;
          else if (r < 0.995) chestCount = 8;
          else if (r < 0.998) chestCount = 9;
          else               chestCount = 10;
        } else {
          const [a, b] = chestRange.split('-').map(Number);
          chestCount = randomInt(a, b);
        }

        for (let i = 0; i < chestCount; i++) {
          const type = pickChestType();
          const crit = rollCrit();
          const finalMult = type.mult * crit.mult;
          if (crit.mult >= 10) roundHasJackpot = true;
          currentChests.push({
            type,
            crit,
            finalMult,
            isLucky: false,
            opened: false
          });
        }
      }
    }

    startCountTicker();

    const wrapW = reelWrap.clientWidth;
    const centerOffset = wrapW / 2 - REEL_ITEM_W / 2;
    const targetItemIndex = randomInt(REEL_ITEMS - 8, REEL_ITEMS - 3);
    const startX = centerOffset - 2 * REEL_ITEM_W;
    const targetX = centerOffset - targetItemIndex * REEL_ITEM_W;

    reelStrip.style.transition = 'none';
    reelStrip.style.transform = `translateX(${startX}px)`;
    void reelStrip.offsetHeight;
    reelStrip.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.12, 0.78, 0.2, 1)`;
    reelStrip.style.transform = `translateX(${targetX}px)`;

    setTimeout(() => {
      spinning = false;
      setSpinButtonState();

      stopSpinSound();

      if (!hasChests) {
        stopCountTicker(0);
        addFeedItem({
          isWin: false,
          id: MY_ID,
          amount: bet,
          isMine: true
        });
        playSfx(sfxLose);
        showLoseOverlay(bet);
        return;
      }

      // Остановили рулетку, показываем количество
      stopCountTicker(chestCount);
      
      // Ждем 1.5 секунды, затем размываем экран и показываем сундуки
      setTimeout(() => {
        openingPhase = true;
        setSpinButtonState();
        chestsOverlay.classList.add('show');
        renderChests();
      }, SHOW_RESULT_DELAY);
      
    }, SPIN_DURATION + 100);
  }

  function renderChests() {
    chestsArea.innerHTML = '';
    currentChests.forEach((chest, idx) => {
      const el = document.createElement('div');
      el.className = 'chest ' + chest.type.key;
      if (chest.isLucky) el.classList.add('lucky');
      el.dataset.index = idx;
      el.style.animationDelay = (idx * 0.07) + 's';

      const img = document.createElement('img');
      img.src = chest.type.img;
      img.alt = chest.type.label;
      el.appendChild(img);

      el.addEventListener('click', () => openChest(idx, el));
      chestsArea.appendChild(el);
    });
    setTimeout(() => {
      const firstClosed = chestsArea.querySelector('.chest:not(.opened)');
      if (firstClosed) {
        firstClosed.classList.add('hint');
        setTimeout(() => firstClosed.classList.remove('hint'), 1100);
      }
    }, 400);
  }

  function openChest(idx, el) {
    const chest = currentChests[idx];
    if (chest.opened || !openingPhase) return;
    if (busyChests.has(idx)) return;

    busyChests.add(idx);

    unlockAudio();
    playSfx(sfxChest);

    el.classList.remove('hint');
    el.classList.add('opening');
    if (navigator.vibrate) navigator.vibrate(20);

    setTimeout(() => {
      chest.opened = true;
      openedCount++;

      el.classList.remove('opening');
      el.classList.add('opened');
      if (chest.crit.cls) el.classList.add(chest.crit.cls);

      const img = el.querySelector('img');
      img.style.opacity = '0';
      setTimeout(() => {
        img.src = chest.type.imgOpen;
        img.style.opacity = '1';
      }, 120);

      let coinGain;
      if (chest.isLucky) {
        coinGain = chest.luckyAmount;
      } else {
        coinGain = Math.round(currentBet * chest.finalMult);
      }

      const badge = document.createElement('div');
      badge.className = 'mult';
      if (chest.isLucky) badge.classList.add('jackpot');
      else if (chest.crit.mult >= 50) badge.classList.add('jackpot');
      else if (chest.crit.mult >= 3) badge.classList.add('crit');
      badge.textContent = formatMoney(coinGain);
      el.appendChild(badge);

      if (navigator.vibrate) {
        if (chest.isLucky) navigator.vibrate([80, 40, 80, 40, 200]);
        else if (chest.crit.mult >= 50) navigator.vibrate([80, 40, 80, 40, 200]);
        else if (chest.crit.mult >= 10) navigator.vibrate([60, 30, 120]);
        else if (chest.crit.mult >= 3) navigator.vibrate([40, 30, 80]);
        else navigator.vibrate(25);
      }

      busyChests.delete(idx);

      if (openedCount === currentChests.length) {
        finishRound();
      }
    }, OPEN_ANIM_MS);
  }

  function finishRound() {
    let winAmount = 0;
    if (roundIsLucky) {
      winAmount = currentChests.reduce((s, c) => s + (c.luckyAmount || 0), 0);
    } else {
      const totalMult = currentChests.reduce((s, c) => s + c.finalMult, 0);
      winAmount = Math.round(currentBet * totalMult);
    }

    const profit = winAmount - currentBet;
    balance += winAmount;
    updateBalance();

    addFeedItem({
      isWin: profit > 0,
      id: MY_ID,
      amount: Math.abs(profit),
      isMine: true
    });

    const isJackpotVisual = roundIsLucky || roundHasJackpot || winAmount >= JACKPOT_VISUAL_THRESHOLD;

    // Ждем 1.5 секунды, чтобы игрок посмотрел на открытые сундуки
    setTimeout(() => {
      // Скрываем оверлей с сундуками
      chestsOverlay.classList.remove('show');

      // Еще небольшая задержка (300мс), чтобы оверлей сундуков успел исчезнуть
      setTimeout(() => {
        if (profit > 0) {
          if (winAmount >= BIG_WIN_THRESHOLD) {
            playSfx(sfxPobeda);
          } else {
            playSfx(sfxWin);
          }
          showWinOverlay(winAmount, isJackpotVisual);
        } else {
          playSfx(sfxLose);
          showLoseOverlay(-profit);
        }
      }, 300);
    }, AFTER_OPEN_DELAY);

    openingPhase = false;
    setSpinButtonState();
  }

  function showWinOverlay(amount, jackpot) {
    winOverlay.classList.remove('lose-mode', 'chest-anim');
    winOverlay.classList.toggle('jackpot-mode', !!jackpot);
    winOverlay.classList.remove('show');
    void winOverlay.offsetHeight;
    winOverlay.classList.add('show');

    const animateChest = amount >= 1000;

    if (!animateChest) {
      overlayChestWrap.style.display = 'none';
      overlayChestWrap.classList.remove('shaking');
      winAmountEl.classList.remove('revealed');
      overlayCoin.textContent = jackpot ? '💎' : '🪙';
      winAmountEl.textContent = formatMoney(amount);
      if (navigator.vibrate) {
        if (jackpot) navigator.vibrate([80, 50, 80, 50, 80, 50, 300]);
        else navigator.vibrate([30, 40, 60]);
      }
      return;
    }

    winOverlay.classList.add('chest-anim');
    overlayChestWrap.style.display = 'flex';
    overlayChestWrap.classList.remove('shaking');
    overlayChestImg.src = 'almaz.png';
    overlayChestImg.classList.remove('opened-img');
    overlayChestImg.style.opacity = '1';
    winAmountEl.textContent = formatMoney(amount);
    winAmountEl.classList.remove('revealed');

    setTimeout(() => {
      overlayChestWrap.classList.add('shaking');
      if (navigator.vibrate) navigator.vibrate(30);
    }, 100);

    setTimeout(() => {
      overlayChestWrap.classList.remove('shaking');
      overlayChestImg.style.opacity = '0';
      setTimeout(() => {
        overlayChestImg.src = 'almaz_ot.png';
        overlayChestImg.classList.add('opened-img');
        overlayChestImg.style.opacity = '1';
        if (navigator.vibrate) {
          if (jackpot) navigator.vibrate([80, 50, 80, 50, 80, 50, 300]);
          else navigator.vibrate([40, 30, 80]);
        }
        setTimeout(() => {
          winAmountEl.classList.add('revealed');
        }, 250);
      }, 150);
    }, 800);
  }

  function showLoseOverlay(amount) {
    winOverlay.classList.remove('jackpot-mode', 'chest-anim');
    winOverlay.classList.add('lose-mode');
    overlayChestWrap.style.display = 'none';
    overlayChestWrap.classList.remove('shaking');
    winAmountEl.classList.remove('revealed');
    overlayCoin.textContent = '💀';
    winAmountEl.textContent = '-' + formatMoney(amount);
    winOverlay.classList.remove('show');
    void winOverlay.offsetHeight;
    winOverlay.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 120]);
  }

  winOverlay.addEventListener('click', () => {
    winOverlay.classList.remove('show');
  });

  function randomId() {
    let s = String(randomInt(1, 9));
    for (let i = 0; i < 8; i++) s += String(randomInt(0, 9));
    return s;
  }

  function randomFeedEvent() {
    const isWin = Math.random() < 0.65;
    const id = randomId();
    let amount;
    if (isWin) {
      const r = Math.random();
      if (r < 0.75)      amount = randomInt(50, 1500);
      else if (r < 0.95) amount = randomInt(1500, 8000);
      else if (r < 0.995) amount = randomInt(8000, 20000);
      else               amount = randomInt(20000, 97000);
    } else {
      amount = randomInt(50, 5000);
    }
    return { isWin, id, amount };
  }

  function addFeedItem(evt) {
    const el = document.createElement('div');
    el.className = 'feed-item';
    if (evt.isMine) el.classList.add('mine');

    const idEl = document.createElement('span');
    idEl.className = 'id';
    idEl.textContent = t('feedIdPrefix') + evt.id;

    const sumEl = document.createElement('span');
    sumEl.className = 'sum ' + (evt.isWin ? 'win' : 'lose');
    sumEl.innerHTML = '<span class="coin-ico">🪙</span>' +
      (evt.isWin ? '+' : '-') + formatMoney(evt.amount);

    el.appendChild(idEl);
    el.appendChild(sumEl);

    feedList.prepend(el);

    while (feedList.children.length > FEED_MAX_ITEMS) {
      feedList.removeChild(feedList.lastChild);
    }
  }

  function scheduleFeed() {
    clearTimeout(feedTimeout);
    feedTimeout = setTimeout(() => {
      addFeedItem(randomFeedEvent());
      scheduleFeed();
    }, randomInt(FEED_INTERVAL_MIN, FEED_INTERVAL_MAX));
  }

  function startFeed() {
    for (let i = 0; i < FEED_MAX_ITEMS; i++) {
      addFeedItem(randomFeedEvent());
    }
    scheduleFeed();
  }

  settingsBtn.addEventListener('click', () => {
    balanceInput.value = balance;
    winChanceInput.value = winChance;
    chestRangeInput.value = chestRange;
    langInput.value = lang;
    settingsModal.classList.add('show');
  });

  settingsClose.addEventListener('click', () => {
    settingsModal.classList.remove('show');
  });

  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) settingsModal.classList.remove('show');
  });

  settingsApply.addEventListener('click', () => {
    let b = parseInt(balanceInput.value, 10);
    if (isNaN(b) || b < 0) b = 0;
    balance = b;
    updateBalance();

    let c = parseInt(winChanceInput.value, 10);
    if (isNaN(c)) c = 70;
    if (c < 0) c = 0;
    if (c > 100) c = 100;
    winChance = c;

    chestRange = chestRangeInput.value;

    const newLang = langInput.value === 'en' ? 'en' : 'ru';
    if (newLang !== lang) {
      lang = newLang;
      try { localStorage.setItem('chestLang', lang); } catch (e) {}
      applyLangToUI();
    }

    settingsModal.classList.remove('show');
  });

  spinBtn.addEventListener('click', doSpin);

  betMinus.addEventListener('click', () => {
    let v = getBet() - 10; if (v < 10) v = 10; betInput.value = v;
  });
  betPlus.addEventListener('click', () => {
    let v = getBet() + 10; if (v > balance) v = balance; betInput.value = v;
  });
  betInput.addEventListener('change', () => {
    let v = parseInt(betInput.value, 10);
    if (isNaN(v) || v < 10) v = 10;
    if (v > balance) v = balance;
    betInput.value = v;
  });

  applyLangToUI();
  langInput.value = lang;

  buildReel();
  updateBalance();
  setSpinButtonState();
  startFeed();
})();
</script>
</body>
</html>
